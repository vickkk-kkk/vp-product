[package]
name = "vp-product-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
private-tls = ["dep:rustls", "dep:rustls-pemfile", "dep:webpki", "dep:yasna", "dep:time", "dep:subtle"]

[dependencies]
subtle = { version = "=2.6.1", optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "=2.2.0", optional = true }
webpki = { package = "rustls-webpki", version = "=0.103.16", default-features = false, features = ["ring", "std"], optional = true }
yasna = { version = "=0.5.2", features = ["time"], optional = true }
time = { version = "=0.3.41", optional = true }
vp-product-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.8"
thiserror = "=2.0.12"
vp-product-import = { path = "../vp-import" }
zeroize.workspace = true

[lints]
workspace = true

[dev-dependencies]
rcgen = { version = "=0.13.2", default-features = false, features = ["ring", "crypto"] }
base64 = "=0.22.1"
