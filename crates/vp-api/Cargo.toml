[package]
name = "vp-product-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vp-product-domain = { path = "../vp-domain" }
vp-product-control = { path = "../vp-control" }
vp-product-core-adapter = { path = "../vp-core-adapter" }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
axum = { version = "=0.8.4", features = ["json", "tokio", "http1"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
rand = "=0.8.5"
sha2 = "=0.10.8"
subtle = "=2.6.1"

[dev-dependencies]
vp-product-storage = { path = "../vp-storage" }
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.3"
tempfile = "=3.19.1"

[lints]
workspace = true
